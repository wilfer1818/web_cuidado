<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paseos Perrunos</title>
<style>
:root{--bg:#faf6ff;--sf:#fff;--tx:#231a33;--mu:#675b7a;--ac:#7b3fc4;--ac2:#eadcfb;--bd:#e3d6f3;--ok:#2e7d32;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f1c;--sf:#1d1628;--tx:#efe8fa;--mu:#b0a3c6;--ac:#b48cf0;--ac2:#2e2147;--bd:#382b4f;--ok:#66bb6a;--er:#ef7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140f1c;--sf:#1d1628;--tx:#efe8fa;--mu:#b0a3c6;--ac:#b48cf0;--ac2:#2e2147;--bd:#382b4f;--ok:#66bb6a;--er:#ef7a7a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--bd);z-index:9;display:flex;gap:8px;align-items:center;padding:8px 12px}
header b{white-space:nowrap;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}
nav a{flex:none;padding:4px 10px;border-radius:99px;background:var(--ac2);color:var(--tx);text-decoration:none;font-size:14px}
nav a.on{background:var(--ac);color:#fff}
main{max-width:900px;margin:auto;padding:12px 14px 60px}
h1,h2{margin:12px 0 6px}h1{color:var(--ac)}h3{margin:0 0 4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.g .c{margin:0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
form{display:grid;gap:8px;max-width:420px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--er)}
.m{color:var(--mu);font-size:14px}.t{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--ac2);font-size:13px}
.alert{padding:8px 12px;border-radius:8px;margin:8px 0;background:var(--ac2);border-left:4px solid var(--ac)}
.alert.e{border-color:var(--er)}.alert.o{border-color:var(--ok)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
img.f{max-width:160px;border-radius:8px;display:block;margin-top:6px}
</style></head><body>
<header><b>🐕 Paseos Perrunos</b><nav id="nav"></nav><button id="th" aria-label="Tema">◐</button></header>
<main id="app"></main>
<script>
var K='pp1',D=null,msg=null,cart={},tab='planes',cur='inicio';
var $=function(s){return document.querySelector(s)};
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function money(n){return '$'+Number(n).toLocaleString('es-CO')}
function fdt(s){return s?new Date(s).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}):'—'}
async function hs(p,s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function sv(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function me(){return D.users.find(function(u){return u.id===D.ses})}
function F(ev){ev.preventDefault();return Object.fromEntries(new FormData(ev.target))}
function note(t,k){msg={t:t,k:k||'o'};sv();r()}
async function init(){
 try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!D){var s=uid();D={ses:null,users:[{id:'adm',nombre:'Administrador',correo:'admin@paseos.co',tel:'',rol:'admin',salt:s,h:await hs('Admin123',s)}],
 mascotas:[],reservas:[],pedidos:[],solic:[],
 planes:[{id:'p1',nombre:'Básico',dur:30,precio:20000,ben:'Paseo de 30 minutos cerca de casa',on:1},{id:'p2',nombre:'Premium',dur:60,precio:35000,ben:'Paseo de 60 minutos, fotos y reporte detallado',on:1},{id:'p3',nombre:'VIP',dur:90,precio:50000,ben:'Paseo de 90 minutos, juego y agua, prioridad de horario',on:1}],
 productos:[{id:'q1',nombre:'Croquetas adulto 2 kg',cat:'Alimento',precio:38000,stock:20,on:1},{id:'q2',nombre:'Correa reforzada',cat:'Accesorios',precio:25000,stock:15,on:1},{id:'q3',nombre:'Galletas de avena (repostería)',cat:'Repostería',precio:12000,stock:30,on:1},{id:'q4',nombre:'Pelota de caucho',cat:'Juguetes',precio:9000,stock:25,on:1}]};sv()}
 window.onhashchange=r;r()}
function menu(){var u=me();
 if(!u)return[['inicio','Inicio'],['login','Mi cuenta']];
 if(u.rol==='admin')return[['inicio','Inicio'],['admin','Administración'],['salir','Cerrar sesión']];
 if(u.rol==='paseador')return[['inicio','Inicio'],['paseos','Mis paseos'],['salir','Cerrar sesión']];
 return[['inicio','Inicio'],['mascotas','Mis mascotas'],['reservar','Reservar'],['reservas','Mis reservas'],['petshop','Pet Shop'],['pedidos','Mis pedidos'],['paseos','Ser paseador'],['salir','Salir']]}
function r(){
 var h=(location.hash||'#inicio').slice(1),m=menu(),ok=m.some(function(x){return x[0]===h});
 if(h==='salir'){D.ses=null;sv();msg={t:'Sesión cerrada.',k:'o'};location.hash='#inicio';return}
 if(!ok){if(!me()&&['mascotas','reservar','reservas','petshop','pedidos','paseos','admin'].indexOf(h)>-1)msg={t:'Inicia sesión para continuar.',k:'e'};h=me()?'inicio':(msg?'login':'inicio')}
 cur=h;
 $('#nav').innerHTML=m.map(function(x){return '<a href="#'+x[0]+'" class="'+(x[0]===h?'on':'')+'">'+x[1]+'</a>'}).join('');
 var v={inicio:vIni,login:vLogin,mascotas:vMas,reservar:vRes,reservas:vMisRes,petshop:vShop,pedidos:vPed,paseos:vPas,admin:vAdm}[h]();
 $('#app').innerHTML=(msg?'<div class="alert '+msg.k+'">'+E(msg.t)+'</div>':'')+v;msg=null}
function vIni(){var u=me();
 return '<h1>Paseos perrunos</h1><p class="m">Paseadores verificados, reservas simples y un Pet Shop para tu mejor amigo.'+(u?' Hola, '+E(u.nombre)+' ('+u.rol+').':'')+'</p><h2>Planes de paseo</h2><div class="g">'+
 D.planes.filter(function(p){return p.on}).map(function(p){return '<div class="c"><h3>'+E(p.nombre)+'</h3><b>'+money(p.precio)+'</b> · '+p.dur+' min<p class="m">'+E(p.ben)+'</p>'+(!u||u.rol==='dueno'?'<button class="p" onclick="pick(\''+p.id+'\')">Reservar</button>':'')+'</div>'}).join('')+'</div>'+
 '<h2>Otros servicios</h2><div class="g"><div class="c"><h3>Guardería</h3><p class="m">Cuidado temporal de tu mascota por periodos largos. Se coordina con el administrador (pago fuera de la plataforma).</p></div><div class="c"><h3>Repostería para mascotas</h3><p class="m">Galletas y snacks seguros para perros. Búscalos en el Pet Shop.</p></div></div>'+
 '<p class="m">Los pagos se coordinan por fuera (efectivo o transferencia). Los datos se guardan en este navegador.</p>'}
function pick(id){D.pre=id;sv();location.hash=me()?'#reservar':'#login'}
function vLogin(){return '<h2>Mi cuenta</h2><div class="g"><div class="c"><h3>Iniciar sesión</h3><form onsubmit="login(event)"><input name="c" type="email" placeholder="Correo" required><input name="p" type="password" placeholder="Contraseña" required><button class="p">Entrar</button></form><p class="m">Demo administrador: admin@paseos.co / Admin123</p></div>'+
 '<div class="c"><h3>Registrarme</h3><form onsubmit="reg(event)"><input name="n" placeholder="Nombre completo" required><input name="c" type="email" placeholder="Correo" required><input name="t" placeholder="Teléfono" required><input name="p" type="password" placeholder="Contraseña (mínimo 8)" minlength="8" required><label class="m"><input type="checkbox" name="ok" required> Autorizo el tratamiento de mis datos personales (Ley 1581 de 2012)</label><button class="p">Crear cuenta</button></form></div></div>'}
async function reg(ev){var f=F(ev),c=f.c.trim().toLowerCase();
 if(D.users.some(function(u){return u.correo===c}))return note('Ese correo ya está registrado.','e');
 if(f.p.length<8)return note('La contraseña debe tener mínimo 8 caracteres.','e');
 var s=uid();D.users.push({id:uid(),nombre:f.n.trim(),correo:c,tel:f.t,rol:'dueno',salt:s,h:await hs(f.p,s)});D.ses=D.users[D.users.length-1].id;sv();location.hash='#inicio';msg={t:'Cuenta creada. ¡Bienvenido!',k:'o'};r()}
async function login(ev){var f=F(ev),u=D.users.find(function(x){return x.correo===f.c.trim().toLowerCase()});
 if(!u||u.h!==await hs(f.p,u.salt))return note('Correo o contraseña incorrectos.','e');
 D.ses=u.id;sv();location.hash=u.rol==='admin'?'#admin':'#inicio';msg={t:'Sesión iniciada.',k:'o'};r()}
function vMas(){var u=me(),l=D.mascotas.filter(function(m){return m.uid===u.id}),e=D.ed?D.mascotas.find(function(m){return m.id===D.ed}):null;e=e||{};
 return '<h2>Mis mascotas</h2><div class="c"><form onsubmit="saveM(event)"><input name="n" placeholder="Nombre" value="'+E(e.n)+'" required><input name="r" placeholder="Raza" value="'+E(e.r)+'" required><input name="e" type="number" min="0" max="30" placeholder="Edad (años)" value="'+E(e.e)+'" required><textarea name="o" placeholder="Observaciones (alergias, comportamiento)">'+E(e.o)+'</textarea><button class="p">'+(e.id?'Guardar cambios':'Agregar mascota')+'</button></form></div>'+
 (l.length?l.map(function(m){return '<div class="c"><h3>'+E(m.n)+'</h3><span class="m">'+E(m.r)+' · '+E(m.e)+' años</span><p class="m">'+E(m.o)+'</p><div class="row"><button onclick="D.ed=\''+m.id+'\';r()">Editar</button><button class="d" onclick="delM(\''+m.id+'\')">Eliminar</button></div></div>'}).join(''):'<p class="m">Aún no tienes mascotas registradas.</p>')}
function saveM(ev){var f=F(ev),u=me();
 if(D.ed){var m=D.mascotas.find(function(x){return x.id===D.ed});m.n=f.n;m.r=f.r;m.e=f.e;m.o=f.o;D.ed=null}else D.mascotas.push({id:uid(),uid:u.id,n:f.n,r:f.r,e:f.e,o:f.o});
 note('Mascota guardada.')}
function delM(id){if(D.reservas.some(function(x){return x.mid===id&&['pendiente','confirmada','en curso'].indexOf(x.estado)>-1}))return note('No puedes eliminar una mascota con reservas activas.','e');
 D.mascotas=D.mascotas.filter(function(m){return m.id!==id});note('Mascota eliminada.')}
function vRes(){var u=me(),ms=D.mascotas.filter(function(m){return m.uid===u.id}),ps=D.planes.filter(function(p){return p.on});
 if(!ms.length)return '<h2>Reservar paseo</h2><div class="alert e">Primero registra al menos una mascota en “Mis mascotas”.</div>';
 var mn=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
 return '<h2>Reservar paseo</h2><div class="c"><form onsubmit="saveR(event)"><label>Plan<select name="p">'+ps.map(function(p){return '<option value="'+p.id+'"'+(D.pre===p.id?' selected':'')+'>'+E(p.nombre)+' — '+money(p.precio)+' · '+p.dur+' min</option>'}).join('')+'</select></label><label>Mascota<select name="m">'+ms.map(function(m){return '<option value="'+m.id+'">'+E(m.n)+'</option>'}).join('')+'</select></label><label>Fecha y hora<input name="f" type="datetime-local" min="'+mn+'" required></label><button class="p">Confirmar reserva</button></form></div>'}
function saveR(ev){var f=F(ev);if(new Date(f.f)<=new Date())return note('No puedes reservar en fechas u horas pasadas.','e');
 D.reservas.push({id:uid(),uid:D.ses,mid:f.m,pid:f.p,fh:f.f,estado:'pendiente',pas:null});D.pre=null;location.hash='#reservas';note('Reserva creada en estado pendiente.')}
function pl(id){return D.planes.find(function(p){return p.id===id})||{}}
function mc(id){return D.mascotas.find(function(m){return m.id===id})||{}}
function us(id){return D.users.find(function(u){return u.id===id})||{}}
function vMisRes(){var l=D.reservas.filter(function(x){return x.uid===D.ses}).sort(function(a,b){return a.fh<b.fh?1:-1});
 return '<h2>Mis reservas</h2>'+(l.length?l.map(function(x){return '<div class="c"><h3>'+E(pl(x.pid).nombre)+' · '+E(mc(x.mid).n)+'</h3><span class="t">'+x.estado+'</span> <span class="m">'+fdt(x.fh)+' · Paseador: '+(x.pas?E(us(x.pas).nombre):'por asignar')+'</span>'+
 (x.rep?'<p>Reporte: '+E(x.rep)+'</p>':'')+(x.foto?'<img class="f" src="'+x.foto+'" alt="Foto del paseo">':'')+
 (x.res?'<p class="m">Tu calificación: '+'★'.repeat(x.res.c)+' '+E(x.res.t)+'</p>':'')+
 '<div class="row">'+(x.estado==='pendiente'||x.estado==='confirmada'?'<button class="d" onclick="canc(\''+x.id+'\')">Cancelar</button>':'')+
 (x.estado==='finalizada'&&!x.res?'<form onsubmit="rate(event,\''+x.id+'\')" class="row"><select name="c"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input name="t" placeholder="Comentario"><button class="p">Calificar</button></form>':'')+'</div></div>'}).join(''):'<p class="m">No tienes reservas.</p>')}
function canc(id){var x=D.reservas.find(function(y){return y.id===id});if(new Date(x.fh)-new Date()<7200000)return note('Solo puedes cancelar con al menos 2 horas de anticipación.','e');x.estado='cancelada';note('Reserva cancelada.')}
function rate(ev,id){var f=F(ev),x=D.reservas.find(function(y){return y.id===id});if(x.estado!=='finalizada'||x.res)return;x.res={c:+f.c,t:f.t};note('¡Gracias por tu calificación!')}
function vShop(){var tot=0,ks=Object.keys(cart);
 return '<h2>Pet Shop</h2><div class="g">'+D.productos.filter(function(p){return p.on}).map(function(p){return '<div class="c"><h3>'+E(p.nombre)+'</h3><span class="t">'+E(p.cat)+'</span><p><b>'+money(p.precio)+'</b> <span class="m">· stock '+p.stock+'</span></p><button class="p" '+(p.stock?'':'disabled')+' onclick="add(\''+p.id+'\')">'+(p.stock?'Agregar':'Agotado')+'</button></div>'}).join('')+'</div>'+
 '<h2>Mi pedido</h2><div class="c">'+(ks.length?ks.map(function(k){var p=D.productos.find(function(x){return x.id===k});tot+=p.precio*cart[k];return '<div class="row">'+E(p.nombre)+' × '+cart[k]+' = '+money(p.precio*cart[k])+' <button onclick="rem(\''+k+'\')">Quitar</button></div>'}).join('')+'<p><b>Total: '+money(tot)+'</b></p><button class="p" onclick="buy()">Confirmar pedido</button>':'<span class="m">Tu pedido está vacío.</span>')+'</div>'}
function add(id){var p=D.productos.find(function(x){return x.id===id});if((cart[id]||0)+1>p.stock)return note('No hay más stock disponible de este producto.','e');cart[id]=(cart[id]||0)+1;r()}
function rem(id){delete cart[id];r()}
function buy(){var it=[],tot=0;for(var k in cart){var p=D.productos.find(function(x){return x.id===k});if(cart[k]>p.stock)return note('Stock insuficiente para '+p.nombre+'.','e');it.push({pid:k,n:p.nombre,q:cart[k],pu:p.precio});tot+=p.precio*cart[k]}
 it.forEach(function(i){D.productos.find(function(x){return x.id===i.pid}).stock-=i.q});
 D.pedidos.push({id:uid(),uid:D.ses,fecha:new Date().toISOString(),items:it,total:tot,estado:'recibido'});cart={};location.hash='#pedidos';note('Pedido recibido. El pago se coordina por fuera.')}
function vPed(){var l=D.pedidos.filter(function(x){return x.uid===D.ses}).reverse();
 return '<h2>Mis pedidos</h2>'+(l.length?l.map(function(x){return '<div class="c"><span class="t">'+x.estado+'</span> <span class="m">'+fdt(x.fecha)+'</span><p>'+x.items.map(function(i){return E(i.n)+' × '+i.q}).join(', ')+'</p><b>Total: '+money(x.total)+'</b></div>'}).join(''):'<p class="m">No tienes pedidos.</p>')}
function vPas(){var u=me();
 if(u.rol==='paseador'){var l=D.reservas.filter(function(x){return x.pas===u.id&&x.estado!=='cancelada'}).sort(function(a,b){return a.fh>b.fh?1:-1});
  return '<h2>Mis paseos asignados</h2>'+(l.length?l.map(function(x){return '<div class="c"><h3>'+E(mc(x.mid).n)+' · '+E(pl(x.pid).nombre)+'</h3><span class="t">'+x.estado+'</span> <span class="m">'+fdt(x.fh)+'</span><p class="m">Dueño: '+E(us(x.uid).nombre)+' · Tel. '+E(us(x.uid).tel)+'<br>Observaciones: '+E(mc(x.mid).o||'—')+'</p>'+
  (x.estado==='confirmada'?'<button class="p" onclick="ini(\''+x.id+'\')">Iniciar paseo</button>':'')+
  (x.estado==='en curso'?'<form onsubmit="fin(event,\''+x.id+'\')"><textarea name="o" placeholder="Reporte del paseo" required></textarea><input name="i" type="file" accept="image/*"><button class="p">Finalizar y enviar reporte</button></form>':'')+(x.rep?'<p>Reporte: '+E(x.rep)+'</p>':'')+'</div>'}).join(''):'<p class="m">Aún no tienes paseos asignados.</p>')}
 var s=D.solic.find(function(x){return x.uid===u.id});
 if(s)return '<h2>Ser paseador</h2><div class="c">Tu postulación está <span class="t">'+s.estado+'</span>.'+(s.estado==='aprobada'?' Cierra sesión y vuelve a entrar.':'')+'</div>';
 return '<h2>Postularme como paseador</h2><div class="c"><form onsubmit="post(event)"><input name="d" placeholder="Número de documento" required><input name="z" placeholder="Zona de cobertura (barrio o comuna)" required><textarea name="x" placeholder="Experiencia con mascotas" required></textarea><button class="p">Enviar solicitud</button></form></div>'}
function post(ev){var f=F(ev);D.solic.push({id:uid(),uid:D.ses,doc:f.d,zona:f.z,exp:f.x,estado:'pendiente'});note('Solicitud enviada. El administrador la revisará.')}
function ini(id){var x=D.reservas.find(function(y){return y.id===id});x.estado='en curso';x.ini=new Date().toISOString();note('Paseo iniciado.')}
function fin(ev,id){var f=F(ev),x=D.reservas.find(function(y){return y.id===id});
 function done(fo){x.estado='finalizada';x.fin=new Date().toISOString();x.rep=f.o;if(fo)x.foto=fo;note('Paseo finalizado y reporte enviado.')}
 var fl=f.i;if(fl&&fl.size&&fl.size<400000){var rd=new FileReader();rd.onload=function(){done(rd.result)};rd.readAsDataURL(fl)}else done(null)}
function vAdm(){var T=[['planes','Planes'],['productos','Productos'],['paseadores','Paseadores'],['reservas','Reservas'],['pedidos','Pedidos'],['reportes','Reportes']];
 return '<h2>Administración</h2><div class="tabs">'+T.map(function(t){return '<button class="'+(tab===t[0]?'p':'')+'" onclick="tab=\''+t[0]+'\';r()">'+t[1]+'</button>'}).join('')+'</div>'+({planes:aPl,productos:aPr,paseadores:aPa,reservas:aRe,pedidos:aPe,reportes:aRp}[tab])()}
function aPl(){return '<div class="c"><h3>Nuevo plan</h3><form onsubmit="newP(event)"><input name="n" placeholder="Nombre" required><input name="d" type="number" min="10" placeholder="Duración (min)" required><input name="p" type="number" min="1000" placeholder="Precio" required><input name="b" placeholder="Beneficios" required><button class="p">Crear</button></form></div>'+
 D.planes.map(function(p){return '<div class="c"><h3>'+E(p.nombre)+' '+(p.on?'':'<span class="t">deshabilitado</span>')+'</h3>'+money(p.precio)+' · '+p.dur+' min<p class="m">'+E(p.ben)+'</p><div class="row"><button onclick="ep(\'planes\',\''+p.id+'\')">Cambiar precio</button><button onclick="tg(\'planes\',\''+p.id+'\')">'+(p.on?'Deshabilitar':'Habilitar')+'</button></div></div>'}).join('')}
function newP(ev){var f=F(ev);D.planes.push({id:uid(),nombre:f.n,dur:+f.d,precio:+f.p,ben:f.b,on:1});note('Plan creado.')}
function aPr(){return '<div class="c"><h3>Nuevo producto</h3><form onsubmit="newQ(event)"><input name="n" placeholder="Nombre" required><input name="c" placeholder="Categoría" required><input name="p" type="number" min="100" placeholder="Precio" required><input name="s" type="number" min="0" placeholder="Stock" required><button class="p">Crear</button></form></div>'+
 D.productos.map(function(p){return '<div class="c"><h3>'+E(p.nombre)+' '+(p.on?'':'<span class="t">deshabilitado</span>')+'</h3>'+money(p.precio)+' · stock '+p.stock+'<div class="row"><button onclick="ep(\'productos\',\''+p.id+'\')">Cambiar precio</button><button onclick="es(\''+p.id+'\')">Cambiar stock</button><button onclick="tg(\'productos\',\''+p.id+'\')">'+(p.on?'Deshabilitar':'Habilitar')+'</button></div></div>'}).join('')}
function newQ(ev){var f=F(ev);D.productos.push({id:uid(),nombre:f.n,cat:f.c,precio:+f.p,stock:+f.s,on:1});note('Producto creado.')}
function ep(t,id){var o=D[t].find(function(x){return x.id===id}),v=prompt('Nuevo precio',o.precio);if(v&&+v>0){o.precio=+v;note('Precio actualizado.')}}
function es(id){var o=D.productos.find(function(x){return x.id===id}),v=prompt('Nuevo stock',o.stock);if(v!==null&&+v>=0&&v!==''){o.stock=+v;note('Stock actualizado.')}}
function tg(t,id){var o=D[t].find(function(x){return x.id===id});o.on=o.on?0:1;note('Estado actualizado.')}
function aPa(){var s=D.solic,p=D.users.filter(function(u){return u.rol==='paseador'});
 return '<h3>Solicitudes</h3>'+(s.length?s.map(function(x){return '<div class="c"><b>'+E(us(x.uid).nombre)+'</b> <span class="t">'+x.estado+'</span><p class="m">Doc: '+E(x.doc)+' · Zona: '+E(x.zona)+'<br>'+E(x.exp)+'</p>'+(x.estado==='pendiente'?'<div class="row"><button class="p" onclick="sol(\''+x.id+'\',1)">Aprobar</button><button class="d" onclick="sol(\''+x.id+'\',0)">Rechazar</button></div>':'')+'</div>'}).join(''):'<p class="m">Sin solicitudes.</p>')+
 '<h3>Paseadores verificados</h3>'+(p.length?p.map(function(u){return '<div class="c">'+E(u.nombre)+' · '+E(u.correo)+' · ★ '+avg(u.id)+'</div>'}).join(''):'<p class="m">Aún no hay paseadores verificados.</p>')}
function sol(id,ok){var x=D.solic.find(function(y){return y.id===id});x.estado=ok?'aprobada':'rechazada';if(ok)us(x.uid).rol='paseador';note(ok?'Paseador verificado.':'Solicitud rechazada.')}
function avg(id){var l=D.reservas.filter(function(x){return x.pas===id&&x.res});return l.length?(l.reduce(function(a,x){return a+x.res.c},0)/l.length).toFixed(1):'sin calificaciones'}
function aRe(){var ps=D.users.filter(function(u){return u.rol==='paseador'}),l=D.reservas.slice().sort(function(a,b){return a.fh>b.fh?1:-1});
 return '<h3>Reservas</h3>'+(l.length?l.map(function(x){return '<div class="c"><b>'+E(pl(x.pid).nombre)+' · '+E(mc(x.mid).n)+'</b> <span class="t">'+x.estado+'</span><p class="m">'+fdt(x.fh)+' · Dueño: '+E(us(x.uid).nombre)+' · Paseador: '+(x.pas?E(us(x.pas).nombre):'sin asignar')+'</p>'+
 (x.estado==='pendiente'?(ps.length?'<form class="row" onsubmit="asg(event,\''+x.id+'\')"><select name="p">'+ps.map(function(u){return '<option value="'+u.id+'">'+E(u.nombre)+'</option>'}).join('')+'</select><button class="p">Asignar y confirmar</button></form>':'<span class="m">Se necesita un paseador verificado.</span>'):'')+'</div>'}).join(''):'<p class="m">Sin reservas.</p>')}
function asg(ev,id){var f=F(ev),x=D.reservas.find(function(y){return y.id===id});
 if(D.reservas.some(function(y){return y.id!==id&&y.pas===f.p&&y.fh===x.fh&&y.estado!=='cancelada'}))return note('Ese paseador ya tiene un paseo a la misma hora.','e');
 x.pas=f.p;x.estado='confirmada';note('Paseador asignado y reserva confirmada.')}
function aPe(){var E2=['recibido','en preparación','enviado','entregado'];return '<h3>Pedidos</h3>'+(D.pedidos.length?D.pedidos.slice().reverse().map(function(x){return '<div class="c"><b>'+E(us(x.uid).nombre)+'</b> · '+money(x.total)+' <span class="m">'+fdt(x.fecha)+'</span><p class="m">'+x.items.map(function(i){return E(i.n)+' × '+i.q}).join(', ')+'</p><select onchange="ste(\''+x.id+'\',this.value)">'+E2.map(function(s){return '<option'+(s===x.estado?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'}).join(''):'<p class="m">Sin pedidos.</p>')}
function ste(id,v){D.pedidos.find(function(x){return x.id===id}).estado=v;note('Pedido actualizado.')}
function aRp(){var fin=D.reservas.filter(function(x){return x.estado==='finalizada'}),ing=fin.reduce(function(a,x){return a+(pl(x.pid).precio||0)},0),ip=D.pedidos.reduce(function(a,x){return a+x.total},0);
 return '<div class="g" style="margin-top:8px"><div class="c"><h3>'+D.reservas.length+'</h3>Reservas</div><div class="c"><h3>'+fin.length+'</h3>Paseos realizados</div><div class="c"><h3>'+money(ing)+'</h3>Ingresos por paseos</div><div class="c"><h3>'+D.pedidos.length+'</h3>Pedidos ('+money(ip)+')</div><div class="c"><h3>'+D.users.filter(function(u){return u.rol==='dueno'}).length+'</h3>Dueños registrados</div></div>'+
 '<h3>Mejores paseadores</h3>'+(D.users.filter(function(u){return u.rol==='paseador'}).map(function(u){return '<div class="c">'+E(u.nombre)+' · ★ '+avg(u.id)+'</div>'}).join('')||'<p class="m">Sin datos.</p>')}
$('#th').onclick=function(){var t=document.documentElement,d=t.getAttribute('data-theme'),dk=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;t.setAttribute('data-theme',dk?'light':'dark')};
init();
</script></body></html>
